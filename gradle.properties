# Path to the cloned library-sp26 repo. Relative paths are resolved from this
# repo's root. Uncomment and edit only if you moved library-sp26 somewhere else.
# cs61b.libraryDir=/absolute/path/to/library-sp26

# Java release the assignments compile against. CS 61B sp26 uses JDK 25.
# A newer JDK (26+) still works — javac targets 25 via --release.
cs61b.javaRelease=25

# No org.gradle.java.home pin here on purpose.
#
# The wrapper runs Gradle 9.7.0, which supports JDK 17-26, so Gradle runs on
# whatever JDK you have (currently 26) and IntelliJ can sync the project.
#
# Do not drop back to Gradle 9.0.0. Its supported ceiling is JDK 24 — it happens
# to run on 25 from the command line, but IntelliJ enforces the official matrix
# and refuses to sync with "maximum compatible Gradle JVM version is 24".

org.gradle.parallel=true
org.gradle.caching=true
