# Path to the cloned library-sp26 repo. Relative paths are resolved from this
# repo's root. Uncomment and edit only if you moved library-sp26 somewhere else.
# cs61b.libraryDir=/absolute/path/to/library-sp26

# Java release the assignments compile against. CS 61B sp26 uses JDK 25.
# A newer JDK (26+) still works — javac targets 25 via --release.
cs61b.javaRelease=25

# The JVM Gradle itself runs on. This is NOT optional here: Gradle 9.0 cannot
# parse JDK 26 class files (major version 70) and dies with
# "Unsupported class file major version 70" while compiling the build script.
# Pointing at a JDK 25 avoids that without touching your default `java`.
#
# The path below is the JDK 25 bundled inside IntelliJ, which is already on this
# machine. After installing a standalone JDK 25:
#     brew install --cask microsoft-openjdk@25
# switch this to /Library/Java/JavaVirtualMachines/microsoft-25.jdk/Contents/Home
# (or delete the line and bump distributionUrl in gradle/wrapper/
# gradle-wrapper.properties to gradle-9.7-bin.zip, which does support JDK 26).
org.gradle.java.home=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

org.gradle.parallel=true
org.gradle.caching=true
